# Coolify-specific compose file for docker-compose.yaml.
#
# The base docker-compose.yaml is intentionally generic (see the "Auth &
# routing requirements" / worked-example section of README.md) - it doesn't
# hardcode any particular reverse proxy. This file adds back the one label
# this project's own deployment (Coolify + Traefik + Authentik) needs on the
# `api` service, without coupling the base file to Coolify.
#
# Why a separate file instead of an env-var default in docker-compose.yaml:
# an earlier attempt drove this label from `${COOLIFY_TRAEFIK_MIDDLEWARE_LABEL:-}`
# so it would "just" be an env var Coolify users set - but Coolify does not
# perform plain Docker Compose `${VAR:-default}` interpolation on label
# values the way `docker compose` itself does, so the placeholder was never
# substituted on a real deploy.
#
# This file uses the Compose Specification's top-level `include:` directive
# (supported since Compose v2.20 - far below any Compose plugin bundled
# with the Docker 29.x host seen in real Coolify deploy logs, and verified
# working against Compose v5.1.4 locally) to pull in the base
# docker-compose.yaml's services and layer this file's own `services.api.labels`
# on top - entirely standalone, with no separate merge step and no `-f`
# chaining required. This is deliberate: Coolify's "Docker Compose"
# application type deploys a single compose file location and has no
# built-in way to combine two files itself, so this file has to be
# self-sufficient when pointed at directly.
#
# Usage (works identically whether run standalone or not, since `include:`
# already pulls in the base file):
#   docker compose -f docker-compose.coolify.yaml up -d
#
# On Coolify itself: point "Docker Compose Location" directly at this file.
# Verify what Coolify will actually run with:
#   docker compose -f docker-compose.coolify.yaml config
# which should resolve to a complete project with both services and the
# `coolify.traefik.middlewares` label present on `api`.
#
# See README.md's worked example for the full Authentik + Traefik walkthrough.
include:
  - docker-compose.yaml
services:
  api:
    labels:
      # Injects into whatever router Coolify auto-generates for this
      # service's domain, without us having to know/hardcode its
      # Coolify-assigned router name. Requires an `authentik-auth`
      # middleware defined in Coolify's Traefik dynamic config first
      # (Servers > Proxy > Configuration) - see README.md.
      - "coolify.traefik.middlewares=authentik-auth@file"
