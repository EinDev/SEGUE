# Coolify-specific override for docker-compose.yaml.
#
# The base docker-compose.yaml is intentionally generic (see the "Auth &
# routing requirements" / worked-example section of README.md) - it doesn't
# hardcode any particular reverse proxy. This file adds back the one label
# this project's own deployment (Coolify + Traefik + Authentik) needs on the
# `api` service, without coupling the base file to Coolify.
#
# Why a separate file instead of an env-var default in docker-compose.yaml:
# an earlier attempt drove this label from `${COOLIFY_TRAEFIK_MIDDLEWARE_LABEL:-}`
# so it would "just" be an env var Coolify users set - but Coolify does not
# perform plain Docker Compose `${VAR:-default}` interpolation on label
# values the way `docker compose` itself does, so the placeholder was never
# substituted on a real deploy. A standard Compose override file, applied
# via `-f`, works regardless of what a given platform does or doesn't
# interpolate.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.coolify.yaml up -d
#
# On Coolify itself: Coolify's "Docker Compose" application type deploys a
# single compose file location, with no built-in `-f` chaining as of this
# writing. To get this label into a Coolify-managed deployment, either:
#   - Generate a merged file locally and point Coolify's "Docker Compose
#     Location" at that instead of the base file. Use --no-interpolate so
#     this doesn't bake real secret values from your local .env into the
#     merged file - it only needs to merge the `labels:` block, not resolve
#     variables (Coolify resolves those itself at deploy time):
#       docker compose -f docker-compose.yaml -f docker-compose.coolify.yaml \
#         config --no-interpolate > docker-compose.merged.yaml
#   - Or add the label directly on the `api` service through Coolify's own
#     UI (Configuration > General > Labels), keeping in mind that Coolify
#     regenerates the service from docker-compose.yaml on every deploy, so a
#     UI-only label doesn't survive a redeploy the way this file does.
# See README.md's worked example for the full Authentik + Traefik walkthrough.
services:
  api:
    labels:
      # Injects into whatever router Coolify auto-generates for this
      # service's domain, without us having to know/hardcode its
      # Coolify-assigned router name. Requires an `authentik-auth`
      # middleware defined in Coolify's Traefik dynamic config first
      # (Servers > Proxy > Configuration) - see README.md.
      - "coolify.traefik.middlewares=authentik-auth@file"
